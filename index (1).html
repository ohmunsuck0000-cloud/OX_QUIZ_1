<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>생윤 기출 오답 OX</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--paper:#fbfcfe;--ink:#1b2437;--sub:#5d6880;--line:#d3d9e6;--o:#1d5fd1;--obg:#e3edff;--x:#c8372d;--xbg:#fde8e5;--ok:#1f8a4c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141d;--paper:#181e2b;--ink:#e8ecf5;--sub:#9aa5bd;--line:#2c3547;--o:#6ea0ff;--obg:#1b2c4f;--x:#ff7d70;--xbg:#3a1f1d;--ok:#4cc982}}
:root[data-theme="dark"]{--bg:#10141d;--paper:#181e2b;--ink:#e8ecf5;--sub:#9aa5bd;--line:#2c3547;--o:#6ea0ff;--obg:#1b2c4f;--x:#ff7d70;--xbg:#3a1f1d;--ok:#4cc982}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:20px 18px 40px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:26px 24px;
background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 34px;background-position:0 12px}
.card>*{position:relative}
h1{font-family:'Noto Serif KR',serif;font-size:26px;margin:4px 0 6px}
.muted{color:var(--sub);font-size:14px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px}
.count{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.count small{font-size:16px;font-weight:500;color:var(--sub)}
.sec{font-size:15px;font-weight:500;color:var(--sub);text-align:right}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--o);width:0;transition:width .25s}
.who{font-family:'Noto Serif KR',serif;font-weight:700;font-size:19px;color:var(--o);margin:0 0 2px}
.q{font-family:'Noto Serif KR',serif;font-weight:500;font-size:22px;line-height:1.7;margin:0;min-height:120px;word-break:keep-all}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.ox{font-family:'Noto Serif KR',serif;font-size:64px;font-weight:700;line-height:1;padding:22px 0;border-radius:14px;border:2px solid;cursor:pointer;background:var(--paper)}
.ox.o{color:var(--o);border-color:var(--o)}.ox.o:hover:not(:disabled){background:var(--obg)}
.ox.x{color:var(--x);border-color:var(--x)}.ox.x:hover:not(:disabled){background:var(--xbg)}
.ox:disabled{cursor:default;opacity:.45}
.ox.picked{opacity:1;outline:3px solid currentColor;outline-offset:2px}
button:focus-visible,label:focus-within{outline:3px solid var(--o);outline-offset:2px}
.fb{margin-top:20px;min-height:96px}
.verdict{font-weight:700;font-size:17px}
.verdict.good{color:var(--ok)}.verdict.bad{color:var(--x)}
.expl{margin-top:8px;padding:12px 14px;border-left:4px solid var(--x);background:var(--xbg);border-radius:0 8px 8px 0;font-size:16px;word-break:keep-all}
.expl:empty{display:none}
.next{margin-top:14px;width:100%;padding:14px;font-size:17px;font-weight:700;border:0;border-radius:10px;background:var(--ink);color:var(--paper);cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{padding:12px 18px;font-size:15px;font-weight:500;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;font-family:inherit}
.btn.main{background:var(--o);color:#fff;border-color:var(--o);font-weight:700}
.btn.main[disabled]{opacity:.4;cursor:default}
.secs{display:grid;gap:8px;margin:16px 0}
.secs label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);cursor:pointer;font-size:16px}
.secs label span.n{margin-left:auto;color:var(--sub);font-size:14px}
.secs input{width:18px;height:18px;accent-color:var(--o)}
.opt{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:15px}
.list{margin:14px 0 0;padding:0;list-style:none}
.list li{padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.list b{color:var(--o)}
.big{font-family:'Noto Serif KR',serif;font-size:48px;font-weight:700}
.quit{background:none;border:0;color:var(--sub);cursor:pointer;font-size:14px;padding:4px 0;font-family:inherit}
@media (max-width:480px){.q{font-size:19px}.ox{font-size:54px;padding:18px 0}.card{padding:20px 16px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA = [{"sec": "동양 사상", "n": 1, "th": "도가, 불교", "q": "차별하는 마음을 버려야 진리를 깨달을 수 있다", "a": "O", "e": ""}, {"sec": "서양 사상", "n": 1, "th": "메킨타이어", "q": "친밀도에 따른 차등적 대우는 유덕한 행위가 될 수 없다.", "a": "X", "e": "친밀도에 따른 차이가 존재하며 그에 대한 차등적 대우가 있을 수 있다."}, {"sec": "니부어", "n": 1, "th": "니부어", "q": "집단에 대한 개인의 헌신을 이기주의의 표현으로 간주할 수 있다.", "a": "O", "e": "집단에 따른 개인의 충성심: 이기주의의 또 다른 형태"}, {"sec": "니부어", "n": 2, "th": "니부어", "q": "사회 협력의 범위를 확대하면 사회 갈등은 해결될 수 있다.", "a": "X", "e": "사회협력의 범위를 확대해도 사회적 분쟁은 불가피하다."}, {"sec": "니부어", "n": 3, "th": "니부어", "q": "사회 정의의 실현에 기여한 폭력도 본질적으로는 비도덕적이다.", "a": "X", "e": "사회 정의 실현에 기여한 폭력은 도덕적으로 정당하다.(선의지의 통제를 받는)"}, {"sec": "니부어", "n": 4, "th": "니부어", "q": "개인의 선의지가 없다면 정의를 실현하는 것은 불가능하다.", "a": "O", "e": "정의 = 개인의 도덕성 + 강제력(선의지 통제)"}, {"sec": "니부어", "n": 5, "th": "니부어", "q": "개인의 사회적 동정심이 확장되면 사회 갈등이 해소될 수 있다.", "a": "X", "e": "개인적 차원으로 사회 갈등 해소 불가능"}, {"sec": "니부어", "n": 6, "th": "니부어", "q": "도덕적 계몽으로 사회에서 집단 갈등 자체를 소멸시킬 수 있다.", "a": "X", "e": "정치적 강제력도 필요함"}, {"sec": "니부어", "n": 7, "th": "니부어", "q": "비합리적 수단으로서의 강제력은 본질적으로 악이다.", "a": "X", "e": "도덕적으로 정당하다."}, {"sec": "분배적 정의", "n": 1, "th": "롤스", "q": "재산과 소득의 균등 분배가 분배 정의 실현의 전제 조건은 아니다.", "a": "O", "e": "전제는 절차의 공정이다."}, {"sec": "분배적 정의", "n": 2, "th": "노직", "q": "역사적이고 정형적인 원리에 따른 분배의 결과는 정의롭다.", "a": "X", "e": "정형적인 원리에 따른 분배의 결과는 정의롭지 않다."}, {"sec": "분배적 정의", "n": 3, "th": "노직", "q": "과거의 상황은 사물에 대한 응분의 자격을 만드는 요인이다.", "a": "O", "e": "역사적으로 정의로운 절차를 거쳤다면 사물에 대한 응분의 자격을 만든다."}, {"sec": "분배적 정의", "n": 4, "th": "롤스", "q": "복지 국가에서 분배 정의가 완전히 실현된다.", "a": "X", "e": "롤스가 강조한 건 재산소유민주주의다."}, {"sec": "분배적 정의", "n": 5, "th": "롤스", "q": "사회는 협동 체제가 아닌 개인 간 자발적 교환 체제이다.", "a": "X", "e": "롤스는 협동을 강조했다."}, {"sec": "분배적 정의", "n": 6, "th": "노직", "q": "사회는 협동 체제가 아닌 개인 간 자발적 교환 체제이다.", "a": "O", "e": "노직은 사회를 불가침의 권리를 소유한 개인들의 자발적 교환 체계라고 본다."}, {"sec": "분배적 정의", "n": 7, "th": "롤스", "q": "천부적 재능의 분포는 부정의하기에 보상되어야 한다.", "a": "X", "e": "천부적 재능의 분포 그 자체는 정의롭지도 않고 부정의하지도 않다."}, {"sec": "분배적 정의", "n": 8, "th": "롤스", "q": "정의의 일차적 주제는 권리와 의무를 정하는 기본 구조이다.", "a": "O", "e": "평등한 자유의 원칙, 기회균등의 법칙 등"}, {"sec": "분배적 정의", "n": 9, "th": "롤스, 노직", "q": "사회적 불평등의 시정을 위한 기본권의 제한은 부당하다.", "a": "O", "e": "기본권이 1짱이다. 사회적 불평등 따위는 기본권에 비빌 수가 없다."}, {"sec": "분배적 정의", "n": 10, "th": "롤스", "q": "차등의 원칙에는 상호 이익의 원리가 반영되어 있지 않다.", "a": "X", "e": "호혜성이 반영되어 있다."}, {"sec": "분배적 정의", "n": 11, "th": "롤스", "q": "원초적 입장의 당사자는 자신과 타인의 이익에 무관심하다.", "a": "X", "e": "자신의 이익에는 관심이 있다."}, {"sec": "분배적 정의", "n": 12, "th": "롤스", "q": "기본적 자유들은 어떤 조건에서도 제한 없이 보장되어야 한다.", "a": "X", "e": "다른 더 중요한 기본적 자유에 의해 제한 될 수 있다."}, {"sec": "분배적 정의", "n": 13, "th": "노직", "q": "과세 정책은 개인의 소유권을 필연적으로 침해한다.", "a": "X", "e": ""}, {"sec": "분배적 정의", "n": 14, "th": "롤스", "q": "원초적 계약의 당사자는 자신이 최소 수혜자가 될 확률을 계산할 수 있다.", "a": "X", "e": "자신의 위치를 모르기에 계산할 수 없다."}, {"sec": "분배적 정의", "n": 15, "th": "노직", "q": "자연적 능력을 복지 향상을 위한 수단으로 여겨야 한다.", "a": "X", "e": "자신의 자연적 능력은 오직 자신만의 복지를 위한 것이다."}, {"sec": "분배적 정의", "n": 16, "th": "롤스", "q": "천부적 자산에 대한 개인의 소유 권리는 제한될 수 없다.", "a": "X", "e": "다른 기본적 자유를 위해 제한될 수 있다."}, {"sec": "분배적 정의", "n": 17, "th": "롤스", "q": "정의로운 사회 실현을 위해 최소 수혜자의 이익 극대화는 조건 없이 보장되어야 한 다.", "a": "X", "e": "평등한 자유와 기회균등의 법칙에 의해 조건부로 보장되어야 한다."}, {"sec": "분배적 정의", "n": 18, "th": "롤스", "q": "개인은 사회적 협동의 공정한 체제의 규칙에 따라 얻은 모든 것에 대한 권한을 갖는 다.", "a": "O", "e": "정의의 원칙에 해당하는 규칙에 따라 얻은 모든 것은 정당하므로 권한을 가질 수 있다."}, {"sec": "분배적 정의", "n": 19, "th": "마르크스", "q": "계급 간 협력을 통해 필요에 따른 분배를 실현해야 한다.", "a": "X", "e": "마르크스는 프롤레타리아 계급과 자본가 계급 간의 투쟁을 강조했으므로, 프롤레타리아 계급 내에서 협력은 가능하나 계급간 협력은 불가능하다."}, {"sec": "분배적 정의", "n": 20, "th": "롤스", "q": "정의의 원칙이 모든 구성원에게 의무를 부여하는 것은 아니다.", "a": "X", "e": "모든 구성원에게 의무를 부여한다."}, {"sec": "분배적 정의", "n": 21, "th": "롤스", "q": "사회 구성원 모두의 협력을 가능하게 하는 분배만이 정당하다.", "a": "O", "e": ""}, {"sec": "분배적 정의", "n": 22, "th": "노직", "q": "부정의한 분배의 교정 외에 국가의 역할을 허용해선 안 된다.", "a": "X", "e": "범죄자로부터 보호도 해야 하고 개인 간의 계약을 강제로 이행시켜야 한다."}, {"sec": "분배적 정의", "n": 23, "th": "노직", "q": "분배 정의의 목표는 개인의 자유와 기본적 필요 보장에 있다.", "a": "X", "e": "노직은 기본적 필요 보장에 반대할 것이다."}, {"sec": "분배적 정의", "n": 24, "th": "롤스", "q": "재산의 평등한 분배가 정의 원칙에 의해 허용될 수 있다.", "a": "O", "e": "롤스는 모든 사람들에게 이익이 되지 않는 한 차등의 원칙에 의해 재산을 평등하게 분 배해야 한다."}, {"sec": "분배적 정의", "n": 25, "th": "노직", "q": "국가는 자유롭게 체결된 계약의 이행을 강제할 수 있다.", "a": "O", "e": ""}, {"sec": "분배적 정의", "n": 26, "th": "롤스", "q": "사유 재산권은 정의 원칙에 따라 평등하게 분배되어야 한다.", "a": "O", "e": "권리를 분배한다는 것은 할당한다는 뜻으로 이해하면 된다."}, {"sec": "분배적 정의", "n": 27, "th": "롤스, 노직", "q": "천부적 운과 달리 사회적 운은 도덕적 관점에서 임의적이지 않다.", "a": "X", "e": "사회적 운(부모의 소득, 교육 기회 등)도 임의적이다."}, {"sec": "분배적 정의", "n": 28, "th": "롤스", "q": "구성원들의 모든 이익은 공정한 기회균등의 원칙에 의해 평등하게 보장된다.", "a": "X", "e": "공정한 기회 균등의 원칙이 아닌 차등의 원칙이다."}, {"sec": "분배적 정의", "n": 29, "th": "롤스", "q": "최소 수혜자의 복지를 위해 재산 소유의 자유를 제한하는 것은 정의롭다.", "a": "X", "e": "재산 소유의 자유는 1원칙이다. 따라서 최소 수혜자의 복지 따위가 비빌 수 없다."}, {"sec": "분배적 정의", "n": 30, "th": "롤스", "q": "정의로운 사회의 시민은 타인의 복리에 관심을 가져야 한다.", "a": "O", "e": "원초적 입장과 구분해야한다."}, {"sec": "분배적 정의", "n": 31, "th": "롤스", "q": "정의 원칙 수립 시 당사자 간 합의는 가설적이고 비역사적이다.", "a": "O", "e": "무지의 베일에서는 특수한 역사적 조건을 고려하지 않는다."}, {"sec": "분배적 정의", "n": 32, "th": "롤스", "q": "차등의 원칙은 법과 정책에 적용될 뿐만 아니라 사적 거래에도 직접 적용된다.", "a": "X", "e": "차등의 원칙은 사회 구조와 질서 정연한 사회를 위한 것이므로 법과 정책에만 적용된 다."}, {"sec": "분배적 정의", "n": 33, "th": "롤스, 노직", "q": "기본권의 차등적 분배는 사회적 불평등 완화를 목적으로 할 때만 정당화된다.", "a": "X", "e": "기본권은 차등적 분배의 대상이 아니다."}, {"sec": "분배적 정의", "n": 34, "th": "롤스", "q": "정의의 원칙은 사회 내의 기본 구조에 대한 모든 합의를 규제해야 한다.", "a": "O", "e": "구체적 사회 체제 모습을 결정하진 않는다."}, {"sec": "분배적 정의", "n": 35, "th": "롤스", "q": "사회 기본 구조는 시민의 기본적 자유와 권리도 분배한다.", "a": "O", "e": "할당의 개념으로 생각하면 된다."}, {"sec": "분배적 정의", "n": 36, "th": "롤스", "q": "원초적 입장의 개인은 타인이 삶의 목적을 가지고 있음을 모른다.", "a": "X", "e": "내용은 모르지만 기본적인 원리는 안다."}, {"sec": "교정적 정의", "n": 1, "th": "칸트", "q": "살인을 직접 저지른 사람만이 사형 선고의 대상이 된다.", "a": "X", "e": "살인을 명령한 사람도 사형 선고의 대상이 된다."}, {"sec": "교정적 정의", "n": 2, "th": "루소", "q": "살인범은 생명권을 사회에 양도한 것으로 보아야 한다.", "a": "O", "e": "살인범도 살인 전에는 시민이었다."}, {"sec": "교정적 정의", "n": 3, "th": "루소", "q": "살인범은 법률적 인격체가 아닌 공공의 적으로 간주 된다.", "a": "O", "e": "법률적 인격체는 사회 구성원으로 생각하면 된다."}, {"sec": "교정적 정의", "n": 4, "th": "베카리아", "q": "범죄 예방 효과는 형벌 타당성 평가의 기준이 될 수 없다.", "a": "X", "e": "공리주의다."}, {"sec": "교정적 정의", "n": 5, "th": "베카리아", "q": "살인범에 대한 사형은 유용하지도 않고 필요하지도 않다.", "a": "X", "e": "유용하긴 하지만 종신 노역형이 더 유용하다는 입장이다."}, {"sec": "교정적 정의", "n": 6, "th": "베카리아", "q": "형벌은 범죄자의 자발적 동의를 근거로 부과된다.", "a": "O", "e": "사회계약의 입장이라 볼 수 있다."}, {"sec": "교정적 정의", "n": 7, "th": "베카리아", "q": "과도한 형벌은 효용 원리와 사회 계약 모두에 위배 된다.", "a": "O", "e": ""}, {"sec": "교정적 정의", "n": 8, "th": "베카리아, 벤담", "q": "형벌의 크기는 범죄로 이끄는 유혹에 비례해야 한다.", "a": "O", "e": "비례원칙 설명에 해당한다."}, {"sec": "교정적 정의", "n": 9, "th": "벤담", "q": "모든 위법 행위자에 대하여 형벌이 부과되어야 한다.", "a": "X", "e": "벤담은 처벌이 유용하지 않고나 처벌로 인한 고통이 사회적 유용성보다 크다면 처벌이 없는 범죄자가 있을 가능성이 있다."}, {"sec": "교정적 정의", "n": 10, "th": "베카리아", "q": "범죄자보다 시민들에게 더 큰 공포를 주는 형벌이 정당화될 수 있다.", "a": "O", "e": "종신 노역형의 공포는 범죄자보다 시민에게 더 크다."}, {"sec": "교정적 정의", "n": 11, "th": "베카리아", "q": "형벌 집행 시 범죄자의 고통을 최소화할 필요가 있다.", "a": "O", "e": ""}, {"sec": "교정적 정의", "n": 12, "th": "베카리아", "q": "형벌의 정당성은 시민의 동의에서 비롯된 것이다.", "a": "O", "e": "루소도 동의한다."}, {"sec": "교정적 정의", "n": 13, "th": "루소", "q": "형벌의 정당성은 시민의 동의에서 비롯된 것이다.", "a": "O", "e": ""}, {"sec": "교정적 정의", "n": 14, "th": "칸트", "q": "사형은 시민들의 생명을 지키기 위해 실행되는 형벌이다.", "a": "X", "e": "응보주의적 관점에서 동의하지 않을 내용이다."}, {"sec": "교정적 정의", "n": 15, "th": "베카리아", "q": "종신 노역형은 시민뿐만 아니라 범죄자의 이익을 위해서도 집행되어야 한다.", "a": "X", "e": "범죄자의 이익은 고려하지 않는다."}, {"sec": "교정적 정의", "n": 16, "th": "칸트, 루소", "q": "살인범은 사회 성원으로서의 자격이 상실되어야 한다.", "a": "O", "e": ""}, {"sec": "교정적 정의", "n": 17, "th": "베카리아", "q": "종신 노역형은 살인을 방지할 수 있는 유일한 방법이다.", "a": "X", "e": "사형도 있다(그러나 비효율적)"}, {"sec": "교정적 정의", "n": 18, "th": "칸트", "q": "형벌 자체는 범죄자의 존엄성을 실현하기 위한 필요악이다.", "a": "X", "e": "칸트는 형벌을 악으로 생각하지 않는다."}, {"sec": "교정적 정의", "n": 19, "th": "베카리아", "q": "범죄자를 처벌하는 것이 아니라 범죄를 예방하는 것이 정의롭다.", "a": "X", "e": "“아니라” 가 틀림"}, {"sec": "교정적 정의", "n": 20, "th": "칸트", "q": "범죄자의 생득적 인격성을 존중하기 위해서는 사형 이외의 형벌을 부과할 수 없다.", "a": "X", "e": "해당 설명은 살인을 포함한 모든 형벌에 대해 말하는 거기 때문에 틀림.(사형에 대해서 만 저 설명을 할 수 있음)"}, {"sec": "교정적 정의", "n": 21, "th": "칸트, 베카리아", "q": "공적 정의를 실현하기 위해서는 범죄와 형벌 간의 비례관계를 유지해야 한 다.", "a": "O", "e": ""}, {"sec": "교정적 정의", "n": 22, "th": "루소", "q": "사형은 살인범의 자발적 행위에 대한 응보적 형벌이다.", "a": "O", "e": "응보적의 뜻은 마땅히 받아야 한다는 뜻이 있다."}, {"sec": "교정적 정의", "n": 23, "th": "칸트, 베카리아", "q": "형벌은 범죄자의 선을 목적으로 집행되어서는 안 된다.", "a": "O", "e": ""}, {"sec": "국가와 시민의 윤리", "n": 1, "th": "로크", "q": "준법의 의무는 명시적 동의를 통해서만 발생한다.", "a": "X", "e": "묵시적 동의도 OK"}, {"sec": "국가와 시민의 윤리", "n": 2, "th": "맹자", "q": "국가의 통치자는 덕으로써 백성을 감화시켜야 한다.", "a": "O", "e": "감화: 바람직하게 변화(영향 받게)"}, {"sec": "국가와 시민의 윤리", "n": 3, "th": "홉스", "q": "국가에 대한 시민의 의무는 시민의 동의 여부와 무관하다.", "a": "X", "e": "사회계약설"}, {"sec": "국가와 시민의 윤리", "n": 4, "th": "로크", "q": "시민은 국가와 맺은 사회 계약을 철회할 수 있는 권리가 있다.", "a": "X", "e": "시민은 국가와 사회계약을 맺지 않았다."}, {"sec": "국가와 시민의 윤리", "n": 5, "th": "로크", "q": "정부에 의한 시민의 재산권 침해는 정부 해체의 근거가 된다.", "a": "O", "e": "국가가 재산권이나 자유, 생명을 침해한다면 저항권이 성립한다."}, {"sec": "국가와 시민의 윤리", "n": 6, "th": "홉스, 로크", "q": "시민은 주권자로서 동등한 자유와 권리를 지닌다.", "a": "X", "e": "홉스가 반대할 선지이다."}, {"sec": "국가와 시민의 윤리", "n": 7, "th": "로크", "q": "개인과 국가는 상호 간 이익을 전제로 사회 계약을 맺는다.", "a": "X", "e": "개인과 국가가 사회계약을 맺지 않는다."}, {"sec": "국가와 시민의 윤리", "n": 8, "th": "홉스", "q": "절대 권력을 지닌 국가는 주권자들의 사회 계약으로 탄생한다.", "a": "X", "e": "주권자들은 사회계약의 주체가 아니다."}, {"sec": "국가와 시민의 윤리", "n": 9, "th": "홉스, 로크", "q": "자연 상태의 개인은 만물에 대한 권리를 지닌다.", "a": "X", "e": "로크가 반대할 선지이다."}, {"sec": "국가와 시민의 윤리", "n": 10, "th": "롤스", "q": "공직을 맡을 권리를 침해하는 정책은 시민 불복종의 대상이 된다.", "a": "O", "e": "2원칙을 침해했기 때문에"}, {"sec": "국가와 시민의 윤리", "n": 11, "th": "롤스", "q": "시민 불복종은 헌법의 근거에 이의를 제기하는 정치적 행위이다.", "a": "X", "e": "헌법의 근거는 항상 정의롭다."}, {"sec": "국가와 시민의 윤리", "n": 12, "th": "홉스, 로크", "q": "자연 상태의 인간은 자유에 대한 평등한 권리가 있다.", "a": "O", "e": "홉스: 자기보존을 위한 무제한적 자유, 로크: 자연권"}, {"sec": "국가와 시민의 윤리", "n": 13, "th": "롤스", "q": "기본적 자유를 침해한 법에 대한 항거도 정당하지 않을 수 있다.", "a": "O", "e": "심각하게 침해해야 한다. 또한 항거의 형태가 시민 불복종 조건을 충족히키지 못할 경 우 정당화 되지 않을 수 있다."}, {"sec": "국가와 시민의 윤리", "n": 14, "th": "로크", "q": "자연 상태의 모든 인간은 자연법 위반자를 처벌할 권리를 갖는다.", "a": "O", "e": "집행자: 모든 사람"}, {"sec": "국가와 시민의 윤리", "n": 15, "th": "롤스", "q": "체제 효율성을 위해 시민 불복종의 가담 범위는 제한될 수 있다.", "a": "O", "e": "불행한 결과를 고려해야 한다."}, {"sec": "국가와 시민의 윤리", "n": 16, "th": "홉스", "q": "절대 군주는 모든 인간의 사회 계약 체결과 이행을 강제한다.", "a": "X", "e": "절대 군주가 사회 계약으로 탄생했는데 어떻게 사회 계약 체결을 강제하겠는가?"}, {"sec": "국가와 시민의 윤리", "n": 17, "th": "롤스", "q": "유권자 다수가 공개적으로 참여해야만 시민 불복종이 정당화된다.", "a": "X", "e": "사회 소수자들도 가능하다."}, {"sec": "국가와 시민의 윤리", "n": 18, "th": "롤스", "q": "정의의 원칙에 근거하지 않은 양심적 행위도 정당한 시민 불복종이 될 수 있다.", "a": "X", "e": "정의의 원칙에 근거해야 한다."}, {"sec": "국가와 시민의 윤리", "n": 19, "th": "롤스", "q": "평등한 자유의 원칙을 위반한 정책은 정당한 시민 불복종의 대상이 되지 않는 경우가 있다.", "a": "O", "e": "부정의 수준이 미약하다면 대상이 되지 않을 수도 있다."}, {"sec": "국가와 시민의 윤리", "n": 20, "th": "롤스", "q": "거의 정의로운 사회에서는 시민 불복종에 대한 보복적인 억압이 있을 수 없다.", "a": "O", "e": "거의 정의로운 사회는 시민 불복종에 대한 보복적 억압이 없다."}, {"sec": "국가와 시민의 윤리", "n": 21, "th": "롤스", "q": "시민 불복종은 민주 헌법의 의도에 어긋나는 항거이다.", "a": "X", "e": "민주 헌법의 의도=체제, 시민 불복종은 체제에 어긋나지 않는다."}, {"sec": "국가와 시민의 윤리", "n": 22, "th": "롤스", "q": "부정의한 법의 변혁은 시민 불복종의 목적이 아니라 결과이다.", "a": "X", "e": "목적도 맞다."}, {"sec": "국가와 시민의 윤리", "n": 23, "th": "싱어", "q": "시민 불복종은 헌법에 근거한 법에도 이루어질 수 있다.", "a": "O", "e": "공리주의기 때문에 공리로 판단한다."}, {"sec": "국가와 시민의 윤리", "n": 24, "th": "롤스", "q": "시민 불복종은 헌법의 근거가 되는 원칙에 의해 지도되어야 한다.", "a": "O", "e": ""}, {"sec": "국가와 시민의 윤리", "n": 25, "th": "롤스", "q": "헌법에 규정된 방식으로 제정된 법은 시민 불복종의 대상이 아니다.", "a": "X", "e": ""}, {"sec": "국가와 시민의 윤리", "n": 26, "th": "롤스", "q": "시민 불복종은 헌법의 근거가 되는 원칙에 위배되는 행위이다.", "a": "X", "e": "위배되지 않는다."}, {"sec": "국가와 시민의 윤리", "n": 27, "th": "롤스", "q": "시민 불복종은 다수의 정의감에 근거한 양심적 신념의 표현이다.", "a": "O", "e": "주의할 점은 양심적 신념의 표현은 맞지만 근거가 양심은 아니다."}, {"sec": "국가와 시민의 윤리", "n": 28, "th": "롤스", "q": "차등의 원칙에 근거한 법은 시민 불복종의 대상이 될 수 있다.", "a": "O", "e": ""}, {"sec": "국가와 시민의 윤리", "n": 29, "th": "롤스", "q": "양심적 거부에 대한 국가의 규제는 시민 불복종의 대상이 될 수 없다.", "a": "X", "e": ""}, {"sec": "국가와 시민의 윤리", "n": 30, "th": "롤스", "q": "종교의 자유를 부정하는 법은 시민 불복종의 대상이 된다.", "a": "O", "e": "자유의 원칙 위배"}, {"sec": "국가와 시민의 윤리", "n": 31, "th": "롤스", "q": "헌법을 규제하는 원칙은 시민 불복종의 대상에서 제외된다.", "a": "O", "e": "헌법을 규제하는 원칙=정의의 원칙: 정당성의 판단 기준"}, {"sec": "국가와 시민의 윤리", "n": 32, "th": "롤스", "q": "시민 불복종은 정의로운 법을 제정할 절차가 불완전하여 발생할 수 있다.", "a": "O", "e": "거의 정의로운 사회에서는 정의로운 법을 제정할 절차가 불완전하다."}, {"sec": "국가와 시민의 윤리", "n": 33, "th": "롤스", "q": "시민 불복종은 다수결의 원칙에 대한 반대를 표하는 정치 행위이다.", "a": "X", "e": "다수결의 원칙에 근거한 정책이다. 혼돈 금지"}, {"sec": "국가와 시민의 윤리", "n": 34, "th": "롤스", "q": "시민 불복종을 시행하는 의도가 왜곡되는 상황이 초래될 수 있다.", "a": "O", "e": "정의감에 호소하려는 이유를 모를 수 있다. 따라서 제약이나 한계를 고려해야 한다."}, {"sec": "국가와 시민의 윤리", "n": 35, "th": "롤스", "q": "시민 불복종은 행위자의 양심에 부합하는 정치적 행위이다.", "a": "O", "e": "부합할 수 있다."}, {"sec": "국가와 시민의 윤리", "n": 36, "th": "롤스", "q": "시민 불복종은 정치적 원칙에 근거해 정당화되어서는 안 된다.", "a": "X", "e": "정치적 원칙=정의의 원칙"}, {"sec": "국가와 시민의 윤리", "n": 37, "th": "롤스", "q": "거의 정의로운 사회에는 헌법 원칙에 대한 의도적인 위반은 존재하지 않는다.", "a": "X", "e": "헌법 원칙/조항은 시민불복종의 대상이 될 수 있다."}, {"sec": "국가와 시민의 윤리", "n": 38, "th": "롤스", "q": "시민 불복종의 대상이 되는 법은 불복종이 가져올 무질서의 가능성에 근거해 정해진 다.", "a": "X", "e": "고려 와 근거는 다른 말이다. 근거가 아니라 고려라고 써야 한다."}, {"sec": "국가와 시민의 윤리", "n": 39, "th": "로크", "q": "입법권은 어떤 정부 형태든 모든 국가에서 최고 권력이다.", "a": "O", "e": "어느 정부 형태든 입법부의 승인이 없다면 법의 효력이 없다."}, {"sec": "과학 기술과 윤리", "n": 1, "th": "야스퍼스", "q": "기술을 선택하고 그 활용을 결정하는 기준은 가치중립적이다.", "a": "X", "e": "기술을 선택하고 활용할 때 가치 판단이 개입한다."}, {"sec": "과학 기술과 윤리", "n": 2, "th": "야스퍼스", "q": "기술은 그 자체로 지향하는 목적을 가지고 있다.", "a": "X", "e": "그 자체로 지향하는 목적은 없다."}, {"sec": "과학 기술과 윤리", "n": 3, "th": "하이데거", "q": "기술 그 자체는 규범적 기준에 의해 평가되어야 한다.", "a": "O", "e": "규범적 가치에 따라 판단되어야 한다."}, {"sec": "과학 기술과 윤리", "n": 4, "th": "하이데거", "q": "현대 기술은 에너지를 얻기 위해 자연을 은폐시킨다.", "a": "X", "e": "탈은폐(P)이다."}, {"sec": "과학 기술과 윤리", "n": 5, "th": "요나스", "q": "현세대는 전통 윤리학이 부과하는 책임에서 자유로워야 한다.", "a": "X", "e": "전통윤리학도 포함해야 한다."}, {"sec": "과학 기술과 윤리", "n": 6, "th": "요나스", "q": "인간은 현대 기술이 초래한 모든 문제를 해결할 능력을 지닌다.", "a": "X", "e": ""}, {"sec": "과학 기술과 윤리", "n": 7, "th": "요나스", "q": "인간에 대한 의무는 자연에 대한 의무로 대체되어야 한다.", "a": "X", "e": "둘 다 필요함"}, {"sec": "과학 기술과 윤리", "n": 8, "th": "요나스", "q": "새로운 윤리학은 무조건적으로 준수해야할 명령을 제시한다.", "a": "O", "e": "이를 생태학적 정언명령이라고 한다."}, {"sec": "과학 기술과 윤리", "n": 9, "th": "요나스", "q": "인간은 가치 중립적 관점에서 자연과의 관계를 정립해야 한다.", "a": "X", "e": "윤리적 판단이나 성찰이 필요하다."}, {"sec": "과학 기술과 윤리", "n": 10, "th": "요나스", "q": "현대 과학 기술의 힘은 인간 행위의 본질을 변화시키지 못한다.", "a": "X", "e": "기술의 힘은 인간 행위의 본질을 근본적으로 바꾼다."}, {"sec": "자연과 윤리", "n": 1, "th": "테일러", "q": "인간이 아닌 생명체에 대한 해악 금지 의무는 그 생명체의 내재적 선에 근거한다.", "a": "O", "e": ""}, {"sec": "자연과 윤리", "n": 2, "th": "레오폴드", "q": "인간이 아닌 생명체에 대한 해악 금지 의무는 그 생명체의 내재적 선에 근거한다.", "a": "X", "e": "생명 공동체를 위해 생명체에 해악 가능"}, {"sec": "자연과 윤리", "n": 3, "th": "칸트", "q": "어떤 생명체의 존속은 그 생명체의 본래적 가치에 의해 정당화 된다.", "a": "O", "e": "예시: 인간"}, {"sec": "자연과 윤리", "n": 4, "th": "싱어", "q": "유정성이 없는 생명체들은 도덕적인 지위를 지닌다.", "a": "X", "e": "유정성 X 생명체: 쾌고감수능력 X, 식물"}, {"sec": "자연과 윤리", "n": 5, "th": "싱어", "q": "모든 생명체는 의식적으로 목표와 목적을 추구한다.", "a": "X", "e": "인간&동물 일부: 의식적 <-> 나머지: 무의식적"}, {"sec": "자연과 윤리", "n": 6, "th": "레건", "q": "생태계의 안정성 회복을 위한 인간의 개입이 정당화되는 경우가 있다.", "a": "O", "e": "원칙적으로는 방임 옹호, but 삶의 주체 권리를 위해 정당화 가능"}, {"sec": "자연과 윤리", "n": 7, "th": "테일러", "q": "생태계의 안정성 회복을 위한 인간의 개입이 정당화되는 경우가 있다.", "a": "O", "e": "목적론적 삶의 중심 보호를 위해 정당화 가능"}, {"sec": "자연과 윤리", "n": 8, "th": "레건", "q": "쾌고 감수 능력은 어떤 개체가 도덕적 지위를 갖는지 판단할 때 고려해야할 조건이 아 니다.", "a": "X", "e": "쾌고감수능력 + 지각,믿음,기억 등을 지닌 삶의 주체"}, {"sec": "자연과 윤리", "n": 9, "th": "칸트", "q": "생명체 중에서 인간만이 가치를 지닌 존재이다.", "a": "X", "e": "다른 동물들도 수단적 가치가 있음"}, {"sec": "자연과 윤리", "n": 10, "th": "테일러", "q": "목표 지향적 활동의 여부는 도덕적 고려의 유일한 기준이다.", "a": "X", "e": "기계: 목표지향적 활동, but 고유한 선 X-> 목표지향적 활동은 유일한 기준이 아니다"}, {"sec": "자연과 윤리", "n": 11, "th": "레건", "q": "인간의 가치 평가에서 독립하여 가치를 지닌 존재의 이용은 해악보다 이익이 크다면 정당화 된다.", "a": "X", "e": "레건: 공리주의 비판"}, {"sec": "자연과 윤리", "n": 12, "th": "테일러", "q": "생명을 지니고 있는 개체만이 의무의 대상이 될 수 있다.", "a": "X", "e": "생명 공동체도 의무의 대상 가능"}, {"sec": "자연과 윤리", "n": 13, "th": "테일러", "q": "생태계를 통제하려는 시도를 하지 말아야 한다.", "a": "O", "e": "불간섭의 의무"}, {"sec": "자연과 윤리", "n": 14, "th": "칸트", "q": "인간은 무생물과 관련해서는 의무를 지니지 않는다.", "a": "X", "e": "~에 관련해서:간접적 의무"}, {"sec": "자연과 윤리", "n": 15, "th": "칸트", "q": "인간에 대해서뿐만 아니라 자연과 관련해서도 인간의 의무가 발생한다.", "a": "O", "e": ""}, {"sec": "자연과 윤리", "n": 16, "th": "싱어", "q": "인간은 다른 모든 생명체보다 본질적으로 우월하지 않다.", "a": "X", "e": "싱어는 인간이 쾌고감수능력이 없는 일부 동물보다는 우월하다고 본다."}, {"sec": "자연과 윤리", "n": 17, "th": "싱어", "q": "생명체는 종에 상관 없이 도덕적 지위를 지닌다.", "a": "X", "e": "쾌고감수능력을 지닌 동물종만이 도덕적 지위를 갖는다."}, {"sec": "자연과 윤리", "n": 18, "th": "테일러, 레건", "q": "개체에 대한 도덕적 존중은 내재적 가치에 근거한다.", "a": "O", "e": ""}, {"sec": "자연과 윤리", "n": 19, "th": "테일러", "q": "도덕적 행위 능력이 없는 존재도 모두 내재적 가치를 지닌다.", "a": "X", "e": "존재 중 생명체"}, {"sec": "자연과 윤리", "n": 20, "th": "레건", "q": "어떤 주체를 목적 그 자체로 보는 근거가 이성이 아니다.", "a": "O", "e": "이성이 아니라 삶의 주체"}, {"sec": "자연과 윤리", "n": 21, "th": "레건", "q": "성장한 포유동물은 결코 인간을 위한 자원으로 대우받아서는 안 된다.", "a": "O", "e": "싱어와의 차이점."}, {"sec": "자연과 윤리", "n": 22, "th": "레오폴드, 테일러, 레건", "q": "비도구적 가치를 지닌 비이성적 존재를 수단으로 사용하는 것은 어떠한 경우에도 정당화될 수 없다.", "a": "X", "e": ""}, {"sec": "자연과 윤리", "n": 23, "th": "칸트", "q": "의식은 도덕적 행위의 주체가 되기 위한 필요충분조건이다.", "a": "X", "e": "+ 이성, 자율성"}, {"sec": "자연과 윤리", "n": 24, "th": "싱어", "q": "종이 다른 개체를 서로 다르게 대우하는 것이 정당화 될 수 있다.", "a": "O", "e": ""}, {"sec": "자연과 윤리", "n": 25, "th": "테일러", "q": "생명 공동체, 즉 생태계는 의무의 대상일 수 있고 도덕적 고려의 대상일 수도 있 다.", "a": "X", "e": "의무의 대상일 수 있지만, 도덕적 고려의 대상일 수는 없다."}, {"sec": "자연과 윤리", "n": 26, "th": "테일러", "q": "인간은 이성적 존재와 동식물에게만 신의의 의무를 져야 한다.", "a": "X", "e": "식물은 아님"}, {"sec": "자연과 윤리", "n": 27, "th": "칸트", "q": "동물의 고통에 대한 동정심은 도덕적 의무에 어긋나지 않는다.", "a": "O", "e": "칸트의 3가지 행위 구분 1. 의무에 반하는 행위(도덕적 악): 거짓말, 살인 등 2. 의무에 맞닿아 있는/의무에 어긋나지 않는 행위(합의무적 행위): 동정심에 의한 기부 3. 의무로‘부터 나온’ 행위: 도덕적 행위"}, {"sec": "자연과 윤리", "n": 28, "th": "칸트", "q": "인간 아닌 동물 중 인간에 대한 의무에 귀속되지 않는 의무의 대상이 있다.", "a": "X", "e": "인간에 대한 의무에 귀속: 간접적 의무"}, {"sec": "자연과 윤리", "n": 29, "th": "테일러, 싱어", "q": "생명이 있는 비이성적 존재에게 도덕적 지위를 부여하는 것은 정당화될 수 있다.", "a": "O", "e": ""}, {"sec": "자연과 윤리", "n": 30, "th": "테일러, 싱어", "q": "동물에 대한 인간의 의무는 조건부로 이행될 수 있다.", "a": "O", "e": "테일러: 인간의 기본적 선 vs 동물의 기본적 선-> 동물 희생"}, {"sec": "자연과 윤리", "n": 31, "th": "칸트", "q": "자신 이외의 존재에 대한 도덕적 의무는 성립 불가능하다.", "a": "X", "e": "다른 인간"}, {"sec": "자연과 윤리", "n": 32, "th": "칸트", "q": "인간의 가치 평가로부터 독립된 가치를 지는 개체라면 그 개체의 행위는 도덕 판단의 대상이 아니다.", "a": "X", "e": "반례: 인간"}, {"sec": "자연과 윤리", "n": 33, "th": "칸트", "q": "동물에 대한 학대 금지를 의무로 규정할 수 없다.", "a": "X", "e": "있음(간접적 의무)"}, {"sec": "예술과 윤리", "n": 1, "th": "와일드", "q": "예술 활동에서의 도덕성 추구는 작품의 독창성을 저해한다.", "a": "O", "e": ""}, {"sec": "예술과 윤리", "n": 2, "th": "와일드", "q": "도덕적 삶은 예술가가 다루는 소재에서 제외되어야 한다.", "a": "X", "e": "인정함"}, {"sec": "예술과 윤리", "n": 3, "th": "플라톤", "q": "미적 가치는 무질서한 리듬과 운율 안에서는 존재할 수 없다.", "a": "O", "e": ""}, {"sec": "예술과 윤리", "n": 4, "th": "와일드", "q": "미를 추구하는 행위는 도덕성 촉진에 기여할 수 있다.", "a": "O", "e": "핵심은 도덕적 소재가 포함되지 않은 작품도 가치가 있다는 것임"}, {"sec": "예술과 윤리", "n": 5, "th": "묵자, 순자", "q": "음악은 사회 혼란을 발생시키는 원인이 될 수 있다.", "a": "O", "e": "순자: 나쁜 음악-> 사회 혼란"}, {"sec": "예술과 윤리", "n": 6, "th": "플라톤", "q": "예술은 자연이 완성하지 못한 아름다움을 완성할 수 있다.", "a": "O", "e": "능가 가능, 예술은 자연이 완성하지 못한 미를 완성하는 것을 목표로 삼음"}, {"sec": "예술과 윤리", "n": 7, "th": "칸트", "q": "미적 판단의 기준은 주관과 관계없이 객관적으로 실재한다.", "a": "X", "e": "주관적이나 보편화 가능함"}, {"sec": "예술과 윤리", "n": 8, "th": "톨스토이", "q": "예술은 미적 가치를 추구하는 활동으로 볼 수 있다.", "a": "X", "e": "본질은 미적 가치 추구이나, 도덕 가치의 인도를 받아야 함"}, {"sec": "예술과 윤리", "n": 9, "th": "아리스토텔레스", "q": "예술가는 인간의 악한 성품을 묘사해서는 안 된다.", "a": "X", "e": "가능"}, {"sec": "예술과 윤리", "n": 10, "th": "칸트", "q": "미는 개념 없이도 모든 인간에게 보편적으로 믿음을 준다.", "a": "O", "e": ""}, {"sec": "예술과 윤리", "n": 11, "th": "칸트", "q": "오직 미적 판단이 주관적 만족으로부터 자유로운 판단이다.", "a": "X", "e": "주관적 만족이 아닌 이해 관심이 적절하다."}, {"sec": "지구촌 평화의 윤리", "n": 1, "th": "모겐소", "q": "국가 간 대화와 협력만으로 국제 평화를 실현할 수 있다.", "a": "X", "e": "세력 균형은 대화와 협력과 다른 것임"}, {"sec": "지구촌 평화의 윤리", "n": 2, "th": "칸트, 모겐소", "q": "국제 정치의 영역은 도덕 법칙의 지배를 받는다.", "a": "X", "e": "모겐소는 X: 정치와 도덕성의 개별성 옹호(but, 도덕법칙 자체는 부정 X)"}, {"sec": "지구촌 평화의 윤리", "n": 3, "th": "칸트", "q": "침략에 대한 자국의 방어 수단에 제한을 두어서는 안 된다.", "a": "X", "e": "방어전 역시 상비군 X"}, {"sec": "지구촌 평화의 윤리", "n": 4, "th": "모겐소", "q": "국익은 국제법이 지닌 구속력을 벗어날 수 있는 근거이다.", "a": "O", "e": "도덕규범, 국제법이 통제할 수 없는 것임"}, {"sec": "지구촌 평화의 윤리", "n": 5, "th": "칸트", "q": "국제 관계에서는 국가가 유일한 행위자로 간주된다.", "a": "X", "e": "국가, 국제기구, 비정부 기구 등 있음"}, {"sec": "지구촌 평화의 윤리", "n": 6, "th": "모겐소", "q": "국제기구와 비정부 기구는 국제 사회의 주된 행위자가 된다.", "a": "X", "e": "국가보다 상위의 주권적 권력은 존재 안 함"}, {"sec": "지구촌 평화의 윤리", "n": 7, "th": "모겐소, 칸트", "q": "평화 실현을 위해서는 국가 간 협력이 유일한 방도이다.", "a": "X", "e": "모겐소: + 세력 균형"}, {"sec": "지구촌 평화의 윤리", "n": 8, "th": "칸트, 모겐소", "q": "비민주적 국가에 대해서는 폭력적 개입이 허용된다.", "a": "X", "e": "칸트: 반대"}, {"sec": "지구촌 평화의 윤리", "n": 9, "th": "칸트", "q": "국제법의 이념은 독립적인 국가들 간의 분립을 전제로 한다.", "a": "O", "e": ""}, {"sec": "지구촌 평화의 윤리", "n": 10, "th": "모겐소", "q": "주권보다 상위의 국제적 권위가 분쟁 해결에 필수적이다.", "a": "X", "e": "그런 권위 없음"}, {"sec": "지구촌 평화의 윤리", "n": 11, "th": "칸트", "q": "평화 연맹 가입국은 국제법의 적용 없이 자유로워야 한다.", "a": "X", "e": "국제법 준수-> 자유상태 확보 필요"}, {"sec": "지구촌 평화의 윤리", "n": 12, "th": "갈퉁, 칸트", "q": "평화 조약의 체결은 영원한 평화의 실현을 보장한다.", "a": "X", "e": "갈퉁: 평화 조약 체결은 소극적 평화를 위한 것임. 적극적 평화를 위해서는 불충분함."}, {"sec": "지구촌 평화의 윤리", "n": 13, "th": "갈퉁", "q": "경제적 착취의 제거는 적극적 평화를 위한 필수 조건이다.", "a": "O", "e": ""}, {"sec": "지구촌 평화의 윤리", "n": 14, "th": "갈퉁, 칸트", "q": "물리적 폭력의 소멸은 진정한 평화의 실현을 보장한다.", "a": "X", "e": ""}, {"sec": "지구촌 평화의 윤리", "n": 15, "th": "모겐소", "q": "경쟁 국가의 행동의 경향성을 예측하는 것은 가능하다.", "a": "O", "e": "자국 이익 추구 -> 권력 극대화 추구"}, {"sec": "지구촌 평화의 윤리", "n": 16, "th": "모겐소, 칸트", "q": "전쟁은 국제 평화를 실현하기 위한 최후의 정치적 행위로서 정당화된다.", "a": "X", "e": "모겐소 X"}, {"sec": "지구촌 평화의 윤리", "n": 17, "th": "칸트", "q": "시민법 자체가 한 국가의 대내적 정치 제도를 지정할 수는 없다.", "a": "X", "e": "시민법은 국내 정치 체제 자원에 가까움(국가와 국민 사이의 관계   const saved=store.get();
  app.innerHTML=`<div class="card">
  <h1>생윤 기출 오답 OX</h1>
  <div class="muted">총 ${DATA.length}개 선지 · 틀리면 해설이 나와요</div>
  <div class="secs">${SECS.map(s=>`<label><input type="checkbox" value="${s}" ${sel.has(s)?'checked':''}>${s}<span class="n">${DATA.filter(d=>d.sec===s).length}개</span></label>`).join('')}</div>
  <div class="row" style="margin-top:0"><button class="btn" id="all">전체 선택</button><button class="btn" id="none">전체 해제</button></div>
  <div class="opt"><input type="checkbox" id="shuf"><label for="shuf">문제 순서 섞기</label></div>
  <div class="row"><button class="btn main" id="go">시작하기</button>
  <button class="btn" id="rw" ${saved.length?'':'disabled'}>지난번 틀린 문제만 (${saved.length})</button></div>
  </div>`;
  const boxes=()=>[...app.querySelectorAll('.secs input')];
  boxes().forEach(b=>b.onchange=()=>{b.checked?sel.add(b.value):sel.delete(b.value)});
  document.getElementById('all').onclick=()=>{sel=new Set(SECS);home()};
  document.getElementById('none').onclick=()=>{sel=new Set();home()};
  document.getElementById('go').onclick=()=>{
    const d=DATA.filter(x=>sel.has(x.sec)); if(!d.length){alert('단원을 하나 이상 골라 주세요.');return}
    start(d,document.getElementById('shuf').checked)};
  document.getElementById('rw').onclick=()=>{
    const ids=new Set(store.get());start(DATA.filter(x=>ids.has(x.id)),document.getElementById('shuf').checked)};
}
function start(d,shuffle){
  deck=d.slice(); if(shuffle) for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
  pos=0;wrong=[];show();
}
function show(){
  const d=deck[pos];answered=false;locked=false;
  app.innerHTML=`<div class="card">
  <div class="top"><div class="count">${pos+1}<small> / ${deck.length}</small></div><div class="sec">${esc(d.sec)}<br><span class="muted">전체 ${d.id}번 · 단원 내 ${d.n}번</span></div></div>
  <div class="bar"><i style="width:${pos/deck.length*100}%"></i></div>
  <p class="who">${esc(d.th)}</p>
  <p class="q">${esc(d.q)}</p>
  <div class="btns"><button class="ox o" data-a="O" aria-label="O 맞다">O</button><button class="ox x" data-a="X" aria-label="X 틀리다">X</button></div>
  <div class="fb" id="fb" aria-live="polite"></div>
  </div><div style="margin-top:10px"><button class="quit" id="q">그만하고 처음으로</button></div>`;
  app.querySelectorAll('.ox').forEach(b=>b.onclick=()=>answer(b.dataset.a));
  document.getElementById('q').onclick=home;
}
function answer(a){
  if(answered)return;answered=true;
  const d=deck[pos],ok=a===d.a,fb=document.getElementById('fb');
  app.querySelectorAll('.ox').forEach(b=>{b.disabled=true;if(b.dataset.a===a)b.classList.add('picked')});
  if(ok){fb.innerHTML=`<div class="verdict good">정답</div>`;timer=setTimeout(next,650);return}
  wrong.push(d.id);
  fb.innerHTML=`<div class="verdict bad">오답 · 정답은 ${d.a}</div><div class="expl">${esc(d.e)}</div><button class="next" id="nx">${pos+1<deck.length?'다음 문제':'결과 보기'}</button>`;
  document.getElementById('nx').onclick=next;document.getElementById('nx').focus();
}
function next(){
  clearTimeout(timer);
  if(pos+1>=deck.length){return result()}
  pos++;show();
}
function result(){
  store.set(wrong);
  const n=deck.length,r=n-wrong.length;
  app.innerHTML=`<div class="card"><h1>결과</h1>
  <div class="big">${r} / ${n}</div><div class="muted">정답률 ${Math.round(r/n*100)}%</div>
  ${wrong.length?`<ul class="list">${wrong.map(id=>{const d=DATA[id-1];return `<li><b>${esc(d.th)}</b> : ${esc(d.q)}<br><span class="muted">정답 ${d.a}${d.e?' — '+esc(d.e):''}</span></li>`}).join('')}</ul>`:'<p>전부 맞혔어요!</p>'}
  <div class="row">${wrong.length?'<button class="btn main" id="rt">틀린 문제만 다시 풀기</button>':''}<button class="btn" id="hm">처음으로</button></div></div>`;
  const rt=document.getElementById('rt');
  if(rt)rt.onclick=()=>start(wrong.map(id=>DATA[id-1]),false);
  document.getElementById('hm').onclick=home;
}
document.addEventListener('keydown',e=>{
  if(!document.querySelector('.ox'))return;
  const k=e.key.toLowerCase();
  if(!answered){if(k==='o'||k==='arrowleft')answer('O');else if(k==='x'||k==='arrowright')answer('X')}
  else if((k==='enter'||k===' ')&&document.getElementById('nx')){e.preventDefault();next()}
});
home();
</script>
</body>
</html>
